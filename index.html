<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>永續飲料店數學小店員</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#5b3a1e;--amber:#f59e0b;}
  html,body{height:100%;margin:0;overflow:hidden;background:#bfe9ff;color:var(--ink);
    font-family:'Huninn','Noto Sans TC',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;}
  ruby{ruby-position:over;ruby-align:center;}
  rt{font-size:.42em;color:#a0522d;font-family:'Noto Sans TC',sans-serif;font-weight:500;letter-spacing:0;line-height:1;}
  body.no-zy rt{display:none;}
  button{font-family:inherit;}

  .pill{background:rgba(255,255,255,.92);border:3px solid #fcd34d;border-radius:999px;padding:.3rem .9rem;font-weight:900;font-size:1.1rem;
    box-shadow:0 4px 0 #f59e0b55;white-space:nowrap;}
  button.pill:active{transform:translateY(2px);}

  .btn-go{background:#22c55e;color:#fff;font-weight:900;font-size:1.5rem;padding:.55rem 1.8rem;border-radius:999px;box-shadow:0 6px 0 #15803d;transition:transform .1s;}
  .btn-go:active{transform:translateY(4px);box-shadow:0 2px 0 #15803d;}
  .btn-go:disabled{background:#a3a3a3;box-shadow:0 6px 0 #737373;}
  .btn-alt{background:#38bdf8;color:#fff;font-weight:900;font-size:1.35rem;padding:.5rem 1.4rem;border-radius:999px;box-shadow:0 6px 0 #0369a1;}
  .btn-alt:active{transform:translateY(4px);box-shadow:0 2px 0 #0369a1;}
  .btn-alt:disabled{background:#a3a3a3;box-shadow:0 6px 0 #737373;}
  .btn-ch{width:4.8rem;height:4.8rem;font-size:2.6rem;font-weight:900;border-radius:1.2rem;background:#e0f2fe;border:4px solid #7dd3fc;box-shadow:0 6px 0 #38bdf8;}
  .btn-ch:active{transform:translateY(4px);box-shadow:0 2px 0 #38bdf8;}
  .btn-card{border-radius:1.3rem;background:#fff;border:4px solid #fcd34d;box-shadow:0 6px 0 #f59e0b;padding:.7rem 1.2rem;font-size:1.35rem;font-weight:900;}
  .btn-card:active{transform:translateY(4px);box-shadow:0 2px 0 #f59e0b;}
  .cslot{display:inline-flex;align-items:center;justify-content:center;width:4rem;height:4rem;border:4px dashed #f59e0b;border-radius:999px;color:#f59e0b;font-weight:900;font-size:2.4rem;}

  /* 面板 */
  #panel{scrollbar-width:thin;}
  .bubble{position:relative;background:#fff8ec;border:4px solid #fcd34d;border-radius:1.4rem;padding:.6rem 1.1rem;font-size:1.45rem;line-height:2.3rem;font-weight:700;flex:1;}
  .bubble::before{content:"";position:absolute;left:-16px;top:20px;border:12px solid transparent;border-right-color:#fcd34d;}
  .tag{background:#fde68a;border-radius:999px;padding:.2rem 1rem;font-weight:900;font-size:1.15rem;}
  .q{font-size:1.4rem;font-weight:800;line-height:2.3rem;}
  .tip{background:#f0f9ff;border:4px solid #7dd3fc;border-radius:1.2rem;padding:.7rem 1rem;font-size:1.35rem;font-weight:800;line-height:2.3rem;min-height:3.6rem;}
  .eq{font-size:2.3rem;font-weight:900;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;justify-content:center;}
  .eqline{font-size:1.9rem;font-weight:900;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin:.4rem 0;}
  .note{font-size:1.1rem;background:#fee2e2;color:#dc2626;border-radius:999px;padding:.1rem .7rem;}

  /* 答案格 + 鍵盤 */
  .sl{display:inline-flex;align-items:center;justify-content:center;min-width:3.2rem;height:3.7rem;padding:0 .3rem;border:4px dashed var(--amber);
    border-radius:.9rem;background:#fffbeb;font-size:2.4rem;font-weight:900;color:#1d4ed8;cursor:pointer;vertical-align:middle;transition:.15s;}
  .sl-sm{min-width:2.3rem;height:2.4rem;font-size:1.5rem;border-width:3px;border-radius:.6rem;}
  .sl-w{min-width:4.8rem;}
  .sl:empty::before{content:attr(data-ph);color:#d4b483;}
  .sl[data-lock]{opacity:.4;border-color:#d1d5db;cursor:default;}
  .sl.act{border-style:solid;border-color:#f97316;background:#fff;box-shadow:0 0 0 5px #fed7aa;opacity:1;animation:glow 1.2s infinite;}
  .sl.done{opacity:1;border-style:solid;border-color:#22c55e;background:#f0fdf4;color:#15803d;animation:none;}
  @keyframes glow{50%{box-shadow:0 0 0 9px #fed7aa88;}}
  .kp{background:#fef3c7;border:4px solid #fcd34d;border-radius:1.4rem;padding:.7rem;}
  .kp-t{text-align:center;font-weight:900;margin-bottom:.4rem;}
  .kp .grid{grid-template-columns:repeat(3,4rem)!important;}
  .kb{width:4rem;height:3.5rem;font-size:1.9rem;font-weight:900;border-radius:1rem;background:#fff;border:3px solid #fcd34d;box-shadow:0 4px 0 #f59e0b;
    display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0;overflow:hidden;white-space:nowrap;box-sizing:border-box;}
  .kb:active{transform:translateY(3px);box-shadow:0 1px 0 #f59e0b;}
  .kb.del{background:#fee2e2;border-color:#fca5a5;box-shadow:0 4px 0 #ef4444;color:#b91c1c;gap:2px;}
  .kb.del .ic{font-size:1.25rem;line-height:1;}.kb.del .tx{font-size:.8rem;line-height:1;font-weight:900;}
  .kb.ok{background:#22c55e;color:#fff;border-color:#86efac;box-shadow:0 4px 0 #15803d;}

  /* 直式 */
  .vf{display:grid;grid-template-columns:2.8rem 4.8rem 4.8rem;font-size:3rem;font-weight:900;justify-content:center;border-radius:1rem;overflow:hidden;}
  .vc{height:4.6rem;display:flex;align-items:center;justify-content:center;position:relative;}
  .vf .vc:nth-child(3n+2){background:#eff6ff;}
  .vf .vc:nth-child(3n){background:#fff7ed;}
  .vc.hd{height:2.9rem;font-size:1.1rem;}
  .vc.cr{height:3rem;font-size:1.4rem;}
  .vc.ln{border-top:6px solid var(--ink);}
  .vc.opc{color:#ef4444;}
  .colh{border-radius:999px;padding:0 .6rem;color:#fff;}
  .colh.t{background:#3b82f6;}.colh.o{background:#f97316;}
  .bdig{position:relative;display:inline-block;}
  .bdig.pulse{cursor:pointer;color:#e11d48;animation:pulse 1s infinite;}
  .bdig.struck::after{content:"";position:absolute;left:-8px;right:-8px;top:50%;height:5px;background:#ef4444;transform:rotate(-25deg);border-radius:3px;}
  @keyframes pulse{50%{transform:scale(1.25);}}
  .tiny{font-size:1.5rem;color:#e11d48;font-weight:900;transition:opacity .3s;}

  /* 價目表 */
  .menu{background:#3f6b5a;color:#fff;border:8px solid #b5835a;border-radius:1rem;padding:.8rem 1.4rem;max-width:420px;margin:0 auto;box-shadow:0 6px 0 #0002;}
  .menu-h{text-align:center;font-size:1.5rem;font-weight:900;color:#ffe066;margin-bottom:.3rem;}
  .mrow{display:flex;justify-content:space-between;align-items:center;font-size:1.6rem;font-weight:800;padding:.2rem 0;}
  .pr{font-size:2rem;font-weight:900;color:#fff;}
  .stain{display:inline-block;width:1.6rem;height:2rem;vertical-align:middle;border-radius:45% 55% 50% 50%;
    background:radial-gradient(circle at 40% 40%,#8b5a2b,#5c3a1a 70%);box-shadow:0 0 0 4px #7a4a2288;}
  .receipt{background:#fff;border:3px dashed #9ca3af;border-radius:.8rem;padding:.8rem 1.2rem;font-size:1.4rem;font-weight:800;line-height:2.4rem;max-width:460px;margin:.8rem auto;}

  /* 硬幣 */
  .coin{border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-weight:900;color:#5b3a1e;flex:none;
    box-shadow:inset 0 -6px 0 rgba(0,0,0,.15),0 5px 0 rgba(0,0,0,.18);border:4px solid rgba(255,255,255,.6);transition:transform .1s;}
  .coin:active{transform:scale(.9);}
  .c50{width:84px;height:84px;font-size:1.9rem;background:radial-gradient(circle at 35% 30%,#fff3b0,#f4c430 60%,#c99700);}
  .c10{width:72px;height:72px;font-size:1.7rem;background:radial-gradient(circle at 35% 30%,#fff,#d4d4d8 60%,#9ca3af);}
  .c5{width:62px;height:62px;font-size:1.5rem;background:radial-gradient(circle at 35% 30%,#fff,#cbd5e1 60%,#94a3b8);}
  .c1{width:52px;height:52px;font-size:1.3rem;background:radial-gradient(circle at 35% 30%,#ffe2c4,#d99a5b 60%,#a76a35);}
  .coin.sm{transform:scale(.78);margin:-6px;}
  .mc{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;font-size:.8rem;font-weight:900;margin:1px;width:30px;height:30px;}
  .mc.c50{width:34px;height:34px;font-size:.85rem;border-width:2px}.mc.c10{width:30px;height:30px;font-size:.85rem;border-width:2px}
  .mc.c5{width:27px;height:27px;font-size:.8rem;border-width:2px}.mc.c1{width:24px;height:24px;font-size:.75rem;border-width:2px}
  .tray{min-height:104px;background:#fef3c7;border:4px dashed #f59e0b;border-radius:1.3rem;display:flex;flex-wrap:wrap;gap:.2rem;align-items:center;justify-content:center;padding:.5rem;}
  .wcard{background:#fff;border:4px solid #e5e7eb;border-radius:1.2rem;padding:.6rem;text-align:center;}
  .wcard.mine{border-color:#facc15;background:#fefce8;}
  .wcard.best{border-color:#22c55e;box-shadow:0 0 0 5px #bbf7d0;transform:scale(1.04);}

  /* 直尺 */
  .ruler-scroll{overflow-x:auto;padding-bottom:.3rem;}
  .ruler-wrap{position:relative;height:150px;margin:0 auto;}
  .straw{position:absolute;top:22px;height:24px;border-radius:12px;transition:left .35s cubic-bezier(.3,1.4,.6,1);
    background:repeating-linear-gradient(90deg,#ffd60a 0 14px,#ffe866 14px 22px);box-shadow:0 3px 0 #c9a400;}
  .ruler{position:absolute;left:0;right:0;top:60px;height:76px;background:linear-gradient(#fef9c3,#fde68a);border:3px solid #d97706;border-radius:.6rem;}
  .tick{position:absolute;top:0;background:#7c2d12;transform:translateX(-50%);}
  .tick.major{width:3px;height:30px;}.tick.minor{width:2px;height:15px;}
  .tnum{position:absolute;top:32px;transform:translateX(-50%);font-weight:900;font-size:1.2rem;}
  .zero-line{position:absolute;top:6px;height:58px;border-left:4px dashed #ef4444;}

  /* 杯子實測 */
  .cupsim{position:relative;width:190px;height:330px;overflow:hidden;margin:0 auto;}
  .cup2{position:absolute;bottom:0;left:40px;width:110px;border:5px solid #94a3b8;border-top:none;border-radius:0 0 1.2rem 1.2rem;background:rgba(255,255,255,.55);overflow:hidden;}
  .tea{position:absolute;left:0;right:0;bottom:0;height:85%;background:linear-gradient(#e4c29e,#c69c6d);opacity:.75;}
  .pearl{position:absolute;width:13px;height:13px;border-radius:50%;background:#3b2314;}
  .straw2{position:absolute;left:88px;width:14px;display:flex;flex-direction:column;border-radius:7px;overflow:hidden;z-index:2;box-shadow:0 0 0 2px #0002;}
  .rim{position:absolute;left:0;right:0;border-top:3px dashed #ef4444;z-index:3;}
  .rimtag{position:absolute;right:0;font-size:.85rem;font-weight:900;color:#ef4444;z-index:3;background:#fff;border-radius:6px;padding:0 4px;}
  .res{border-radius:1rem;padding:.4rem .8rem;font-size:1.3rem;font-weight:900;text-align:center;margin-top:.4rem;}
  .res.bad{background:#fee2e2;color:#b91c1c;}.res.good{background:#dcfce7;color:#15803d;}
  .seg{height:26px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:1rem;text-shadow:0 1px 2px #0006;border-right:3px solid #fff;}

  /* 怒氣值 */
  .abar{width:min(46vw,320px);height:24px;background:#fff;border:4px solid #fca5a5;border-radius:999px;overflow:hidden;}
  #angerFill{height:100%;width:30%;background:linear-gradient(90deg,#fde047,#f97316,#ef4444);transition:width .8s cubic-bezier(.3,1.4,.5,1);}

  /* 瓶子 & 小杯 */
  .bwrap{display:flex;flex-direction:column;align-items:center;transition:transform .35s;transform-origin:50% 80%;}
  .bwrap.tilt{transform:rotate(-28deg) translateX(10px);}
  .neck{border:5px solid #94a3b8;border-bottom:none;background:rgba(255,255,255,.6);border-radius:.4rem .4rem 0 0;}
  .neck.tall{width:30px;height:24px;}.neck.fat{width:52px;height:18px;}
  .bottle{display:flex;flex-direction:column;justify-content:flex-end;border:5px solid #94a3b8;background:rgba(255,255,255,.6);overflow:hidden;}
  .bottle.tall{width:64px;height:220px;border-radius:1rem 1rem .8rem .8rem;}
  .bottle.fat{width:144px;height:124px;border-radius:1.4rem 1.4rem 1rem 1rem;}
  .layer{transition:height .4s ease;flex:none;}
  .layer.gone{height:0!important;}
  .sc{position:relative;width:32px;height:42px;border:3px solid #94a3b8;border-top:none;border-radius:0 0 .5rem .5rem;overflow:hidden;background:#fff;}
  .sc .fill{position:absolute;left:0;right:0;bottom:0;height:0;transition:height .45s;}
  .sc.full .fill{height:88%;}
  .chart{display:flex;align-items:flex-end;gap:2rem;height:230px;padding:0 1rem;border-left:4px solid var(--ink);border-bottom:4px solid var(--ink);}
  .barc{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .bar{width:64px;border-radius:.6rem .6rem 0 0;transition:height .4s cubic-bezier(.3,1.4,.5,1);}

  /* 地圖卡片 */
  .lvcard{position:relative;width:260px;border-radius:1.8rem;padding:1.2rem;text-align:center;background:#fff;border:6px solid #fcd34d;box-shadow:0 8px 0 #f59e0b;transition:transform .2s;}
  .lvcard:hover:not(.lock){transform:translateY(-6px) rotate(-1deg);}
  .lvcard.lock{filter:grayscale(1);opacity:.75;box-shadow:0 8px 0 #9ca3af;border-color:#d1d5db;cursor:not-allowed;}
  .lvcard.done{border-color:#4ade80;box-shadow:0 8px 0 #16a34a;}
  .lvcard.newly{animation:unlock 1.2s ease 2;}
  @keyframes unlock{0%,100%{transform:scale(1)}30%{transform:scale(1.12) rotate(3deg)}60%{transform:scale(.96) rotate(-3deg)}}
  .role{position:relative;border:6px solid #e5e7eb;border-radius:1.8rem;padding:1rem 1.4rem;background:#fff;transition:.2s;width:100%;}
  .role.sel{border-color:#22c55e;background:#f0fdf4;box-shadow:0 0 0 6px #bbf7d0;}
  .role .chk{position:absolute;top:-14px;right:-14px;width:44px;height:44px;border-radius:999px;background:#22c55e;color:#fff;font-size:1.6rem;display:none;align-items:center;justify-content:center;}
  .role.sel .chk{display:flex;}

  .pcard{display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;border:4px solid #e5e7eb;border-radius:1.2rem;background:#fff;font-size:1.4rem;font-weight:800;cursor:pointer;user-select:none;line-height:2.2rem;}
  .pcard .box{width:2.4rem;height:2.4rem;flex:none;border:4px solid #d1d5db;border-radius:.6rem;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:#fff;}
  .pcard.on{border-color:#4ade80;background:#f0fdf4;}
  .pcard.on .box{background:#22c55e;border-color:#22c55e;}

  #toast{transition:opacity .25s,transform .25s;}
  #toast.show{opacity:1;transform:translate(-50%,0) scale(1);}
  #toast.hide{opacity:0;transform:translate(-50%,-20px) scale(.9);pointer-events:none;}
  .pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1);}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  .bob{animation:bob 1.4s ease-in-out infinite;}
  @keyframes bob{50%{transform:translateY(-8px);}}
  .medal{width:170px;height:170px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:5rem;position:relative;
    background:radial-gradient(circle at 35% 30%,#fff7c2,#facc15 55%,#ca8a04);border:8px solid #fde047;box-shadow:0 0 40px #facc15,0 10px 0 #a16207;animation:spinm 3s ease-in-out infinite;}
  .medal::before,.medal::after{content:"";position:absolute;top:-70px;width:44px;height:90px;z-index:-1;}
  .medal::before{left:40px;background:#ef4444;transform:rotate(18deg);}
  .medal::after{right:40px;background:#3b82f6;transform:rotate(-18deg);}
  @keyframes spinm{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.08)}}
  .cf{position:fixed;top:-24px;width:12px;height:18px;z-index:95;pointer-events:none;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(112vh) rotate(900deg);}}
  .shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
  .frm-card{min-width:4.4rem;height:4.4rem;font-size:2.2rem;font-weight:900;border-radius:1rem;background:#fff;border:4px solid #fcd34d;box-shadow:0 5px 0 #f59e0b;padding:0 .7rem;}
  .frm-card:active{transform:translateY(3px);box-shadow:0 2px 0 #f59e0b;}
  .frm-card.used{opacity:.25;pointer-events:none;}
  .fslot{display:inline-flex;align-items:center;justify-content:center;min-width:4.6rem;height:4.6rem;border:4px dashed #f59e0b;border-radius:1rem;background:#fffbeb;
    font-size:2.3rem;font-weight:900;color:#1d4ed8;cursor:pointer;}
  .fslot.next{border-color:#f97316;box-shadow:0 0 0 5px #fed7aa;}
  .fslot.filled{border-style:solid;background:#fff;}
  .undo-btn{background:#fff;border:3px solid #fb923c;color:#c2410c;font-weight:900;border-radius:999px;padding:.2rem .9rem;font-size:1.1rem;box-shadow:0 4px 0 #fb923c;white-space:nowrap;}
  .undo-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #fb923c;}
  .kb.back{grid-column:span 3;width:100%;flex-direction:row;gap:.4rem;font-size:1.2rem;background:#fff7ed;border-color:#fdba74;box-shadow:0 4px 0 #fb923c;color:#c2410c;}
  .dragb{touch-action:none;cursor:grab;position:relative;z-index:5;user-select:none;}
  .dragb.dragging{cursor:grabbing;z-index:60;filter:drop-shadow(0 14px 10px #0004);}
  .dragb .bwrap{transition:transform .3s;}
  .dragb.pouring .bwrap{transform:rotate(-60deg);}
  .grab-tip{font-size:1rem;font-weight:900;color:#0369a1;background:#e0f2fe;border-radius:999px;padding:.1rem .7rem;margin-top:.3rem;display:inline-block;}
  .stream{position:fixed;width:10px;border-radius:5px;z-index:59;pointer-events:none;}
  .sc{width:40px;height:52px;}
  .cupcell{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .cupno{font-size:.85rem;font-weight:900;background:#fff;border:2px solid #bae6fd;border-radius:999px;padding:0 .45rem;white-space:nowrap;color:#0369a1;}
  .cupcell.got .cupno{background:#22c55e;border-color:#22c55e;color:#fff;}
  .predgrid{display:grid;grid-template-columns:76px max-content max-content minmax(200px,1fr);column-gap:1rem;row-gap:.6rem;align-items:center;}
  .pc{display:flex;align-items:center;height:88px;}
  .pc.ic{justify-content:center;}
  .ph{font-weight:900;color:#a16207;font-size:1rem;border-bottom:3px solid #fde68a;padding-bottom:.2rem;}
  .ptrack{position:relative;width:100%;height:48px;background:#f1f5f9;border-radius:999px;overflow:hidden;border:3px solid #e2e8f0;}
  .pbar{height:100%;width:0;border-radius:999px;transition:width .45s cubic-bezier(.3,1.4,.5,1);}
  .pval{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:1.35rem;font-weight:900;}
  .cwall{display:grid;grid-template-columns:230px 470px 96px 44px 44px 112px;column-gap:12px;row-gap:14px;align-items:center;position:relative;padding:1.6rem 0 .4rem;}
  .cwall .cl{font-size:1.2rem;font-weight:900;text-align:right;white-space:nowrap;}
  .cwall .cn{font-size:1.4rem;font-weight:900;text-align:right;white-space:nowrap;}
  .cwall .cs{font-size:1.6rem;font-weight:900;text-align:center;}
  .cwall .cr{font-size:1.3rem;font-weight:900;white-space:nowrap;}
  .cbar{display:flex;height:34px;border-radius:10px;overflow:hidden;}
  .cbar > div{height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;text-shadow:0 1px 2px #0006;box-shadow:inset -2px 0 0 #fff;}
  .sc.target{box-shadow:0 0 0 4px #fde047;animation:pulse 1s infinite;}
  .wallrow{display:flex;align-items:center;gap:.8rem;margin:.5rem 0;}
  .myth{background:linear-gradient(135deg,#fef9c3,#dcfce7);border:4px solid #4ade80;border-radius:1.2rem;padding:.8rem 1rem;font-size:1.4rem;font-weight:900;line-height:2.3rem;text-align:center;}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<script>
/* =========================================================
   1. 注音字典、工具
========================================================= */
const ZY = {
  '永續':'ㄩㄥˇ ㄒㄩˋ','飲料店':'ㄧㄣˇ ㄌㄧㄠˋ ㄉㄧㄢˋ','數學':'ㄕㄨˋ ㄒㄩㄝˊ','小':'ㄒㄧㄠˇ','店員':'ㄉㄧㄢˋ ㄩㄢˊ','店長':'ㄉㄧㄢˋ ㄓㄤˇ',
  '老闆':'ㄌㄠˇ ㄅㄢˇ','開始':'ㄎㄞ ㄕˇ','角色':'ㄐㄧㄠˇ ㄙㄜˋ','選擇':'ㄒㄩㄢˇ ㄗㄜˊ','名字':'ㄇㄧㄥˊ ˙ㄗ','確定':'ㄑㄩㄝˋ ㄉㄧㄥˋ',
  '關卡':'ㄍㄨㄢ ㄑㄧㄚˇ','地圖':'ㄉㄧˋ ㄊㄨˊ','解鎖':'ㄐㄧㄝˇ ㄙㄨㄛˇ','進店':'ㄐㄧㄣˋ ㄉㄧㄢˋ',
  '找':'ㄓㄠˇ','草莓牛奶':'ㄘㄠˇ ㄇㄟˊ ㄋㄧㄡˊ ㄋㄞˇ','鬆餅':'ㄙㄨㄥ ㄅㄧㄥˇ','價目表':'ㄐㄧㄚˋ ㄇㄨˋ ㄅㄧㄠˇ','線索':'ㄒㄧㄢˋ ㄙㄨㄛˇ',
  '直式':'ㄓˊ ㄕˋ','橫式':'ㄏㄥˊ ㄕˋ','十位':'ㄕˊ ㄨㄟˋ','個位':'ㄍㄜˋ ㄨㄟˋ','進位':'ㄐㄧㄣˋ ㄨㄟˋ','借位':'ㄐㄧㄝˋ ㄨㄟˋ',
  '破解':'ㄆㄛˋ ㄐㄧㄝˇ','找錢':'ㄓㄠˇ ㄑㄧㄢˊ','驗算':'ㄧㄢˋ ㄙㄨㄢˋ','硬幣':'ㄧㄥˋ ㄅㄧˋ','托盤':'ㄊㄨㄛ ㄆㄢˊ','湊':'ㄘㄡˋ',
  '展示牆':'ㄓㄢˇ ㄕˋ ㄑㄧㄤˊ','珍珠奶茶':'ㄓㄣ ㄓㄨ ㄋㄞˇ ㄔㄚˊ','吸管':'ㄒㄧ ㄍㄨㄢˇ','直尺':'ㄓˊ ㄔˇ','測量':'ㄘㄜˋ ㄌㄧㄤˊ',
  '對齊':'ㄉㄨㄟˋ ㄑㄧˊ','刻度':'ㄎㄜˋ ㄉㄨˋ','公分':'ㄍㄨㄥ ㄈㄣ','長度':'ㄔㄤˊ ㄉㄨˋ','備料區':'ㄅㄟˋ ㄌㄧㄠˋ ㄑㄩ',
  '怒氣值':'ㄋㄨˋ ㄑㄧˋ ㄓˊ','示範':'ㄕˋ ㄈㄢˋ','實測':'ㄕˊ ㄘㄜˋ','比較':'ㄅㄧˇ ㄐㄧㄠˋ','容量':'ㄖㄨㄥˊ ㄌㄧㄤˋ',
  '高瘦瓶':'ㄍㄠ ㄕㄡˋ ㄆㄧㄥˊ','矮胖瓶':'ㄞˇ ㄆㄤˋ ㄆㄧㄥˊ','彩虹奶昔':'ㄘㄞˇ ㄏㄨㄥˊ ㄋㄞˇ ㄒㄧ','預測':'ㄩˋ ㄘㄜˋ',
  '長條圖':'ㄔㄤˊ ㄊㄧㄠˊ ㄊㄨˊ','實證':'ㄕˊ ㄓㄥˋ','小杯子':'ㄒㄧㄠˇ ㄅㄟ ˙ㄗ','迷思':'ㄇㄧˊ ㄙ','減塑':'ㄐㄧㄢˇ ㄙㄨˋ',
  '承諾':'ㄔㄥˊ ㄋㄨㄛˋ','勳章':'ㄒㄩㄣ ㄓㄤ','大師':'ㄉㄚˋ ㄕ','恭喜':'ㄍㄨㄥ ㄒㄧˇ','完勝':'ㄨㄢˊ ㄕㄥˋ',
  '自備':'ㄗˋ ㄅㄟˋ','環保杯':'ㄏㄨㄢˊ ㄅㄠˇ ㄅㄟ','環保吸管':'ㄏㄨㄢˊ ㄅㄠˇ ㄒㄧ ㄍㄨㄢˇ','一次性':'ㄧ ㄘˋ ㄒㄧㄥˋ',
  '塑膠':'ㄙㄨˋ ㄐㄧㄠ','海洋':'ㄏㄞˇ ㄧㄤˊ','再玩一次':'ㄗㄞˋ ㄨㄢˊ ㄧ ㄘˋ','注音':'ㄓㄨˋ ㄧㄣ','送出':'ㄙㄨㄥˋ ㄔㄨ'
};
const R = w => { const z = ZY[w]; if(!z) return w; const zs = z.split(' ');
  return Array.from(w).map((c,i)=>`<ruby>${c}<rt>${zs[i]||''}</rt></ruby>`).join(''); };
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const wait = ms => new Promise(r=>setTimeout(r,ms));
const CN = ['','一','二','三'];
const show = (el, flex) => { el.classList.remove('hidden'); if(flex) el.classList.add('flex'); };
const hide = el => { el.classList.add('hidden'); el.classList.remove('flex'); };

/* =========================================================
   2. 音效（Web Audio）＋ 語音（Speech Synthesis）
========================================================= */
let AC = null, soundOn = true, voiceOn = true;
function ac(){ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }
function sfx(type){
  if(!soundOn) return;
  try{
    const a = ac();
    const SET = { ok:[[523,'triangle'],[659,'triangle'],[784,'triangle']], no:[[260,'square'],[196,'square']],
      tap:[[880,'sine']], key:[[1046,'sine']], coin:[[988,'triangle'],[1319,'triangle']], drip:[[620,'sine'],[930,'sine'],[1240,'sine']],
      win:[[523,'triangle'],[659,'triangle'],[784,'triangle'],[1047,'triangle'],[1319,'triangle'],[1568,'triangle']],
      unlock:[[784,'triangle'],[988,'triangle'],[1175,'triangle'],[1568,'triangle']], step:[[200,'sine']] }[type] || [[600,'sine']];
    SET.forEach(([f,w],i)=>{
      const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + i*(type==='drip'?.05:.1);
      o.type = w; o.frequency.value = f;
      const vol = type==='no' ? .07 : type==='key' ? .08 : .2, dur = type==='win' ? .4 : .25;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05);
    });
  }catch(e){}
}
function cheerSound(){
  if(!soundOn) return;
  try{
    const a = ac(), len = a.sampleRate*2.6, buf = a.createBuffer(1,len,a.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (0.6+0.4*Math.sin(i/a.sampleRate*38));
    const src = a.createBufferSource(), bp = a.createBiquadFilter(), g = a.createGain();
    src.buffer = buf; bp.type = 'bandpass'; bp.frequency.value = 1300; bp.Q.value = .7;
    const t = a.currentTime; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.35,t+.25); g.gain.exponentialRampToValueAtTime(.0001,t+2.6);
    src.connect(bp).connect(g).connect(a.destination); src.start(t);
    [523,659,784,1047,784,1047,1319].forEach((f,i)=>{ const o=a.createOscillator(), gg=a.createGain(), tt=t+.1+i*.16;
      o.type='square'; o.frequency.value=f; gg.gain.setValueAtTime(.0001,tt); gg.gain.exponentialRampToValueAtTime(.09,tt+.02); gg.gain.exponentialRampToValueAtTime(.0001,tt+(i===6?.8:.18));
      o.connect(gg).connect(a.destination); o.start(tt); o.stop(tt+.9); });
  }catch(e){}
}
function plain(html){
  const d = document.createElement('div'); d.innerHTML = html; d.querySelectorAll('rt').forEach(r=>r.remove());
  return d.textContent.replace(/[＋+]/g,'加').replace(/[−-]/g,'減').replace(/[＝=]/g,'等於').replace(/[＞>]/g,'大於').replace(/[＜<]/g,'小於')
    .replace(/[△□▢]/g,'空格').replace(/[✔✅❌⭐🎉👍🤔]/g,'').replace(/\s+/g,' ');
}
let zhVoice = null;
function pickVoice(){ const vs = speechSynthesis.getVoices(); zhVoice = vs.find(v=>/zh[-_]TW/i.test(v.lang)) || vs.find(v=>/zh/i.test(v.lang)) || null; }
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(html, interrupt){
  if(!voiceOn || !('speechSynthesis' in window)) return;
  try{
    if(interrupt) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(plain(html)); u.lang = 'zh-TW'; u.rate = 1.02; u.pitch = 1.2;
    if(zhVoice) u.voice = zhVoice; speechSynthesis.speak(u);
  }catch(e){}
}

/* =========================================================
   3. 3D 世界：街道場景 ＋ 飲料店場景（Three.js）
========================================================= */
const W = (() => {
  const cv = $('#scene');
  const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .1, 200);

  const mat = (c,o={}) => new THREE.MeshStandardMaterial(Object.assign({color:c, roughness:.65}, o));
  const B = (w,h,d) => new THREE.BoxGeometry(w,h,d);
  const C = (a,b,h,s=28) => new THREE.CylinderGeometry(a,b,h,s);
  const Sp = r => new THREE.SphereGeometry(r, 28, 18);
  function mesh(par, geo, c, x, y, z, o){
    const m = new THREE.Mesh(geo, c instanceof THREE.Material ? c : mat(c,o));
    m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true; par.add(m); return m;
  }
  const redraws = [];
  function textTex(drawFn, w=1024, h=200){
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d'), tex = new THREE.CanvasTexture(c);
    const run = () => { drawFn(ctx, w, h); tex.needsUpdate = true; };
    run(); redraws.push(run); return { tex, run };
  }
  if(document.fonts) document.fonts.ready.then(()=>redraws.forEach(f=>f()));
  const FONT = s => `900 ${s}px Huninn, "Noto Sans TC", sans-serif`;
  function lights(sc){
    sc.add(new THREE.HemisphereLight(0xffffff, 0xffd6a5, .85));
    const sun = new THREE.DirectionalLight(0xffffff, .8); sun.position.set(6,12,8); sun.castShadow = true;
    sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera,{left:-30,right:30,top:20,bottom:-20,near:1,far:60});
    sc.add(sun);
  }

  /* ---------- 人物工廠 ---------- */
  function person(shirt, hair, o={}){
    const g = new THREE.Group();
    const shirtM = mat(shirt), hairM = mat(hair), skinM = mat(0xffd7b5);
    const legs = [], arms = [];
    [-.13,.13].forEach(x=>{ const p = new THREE.Group(); p.position.set(x,.68,0); g.add(p); mesh(p, C(.085,.085,.62), 0x3d405b, 0,-.31,0); legs.push(p); });
    mesh(g, C(.27,.31,.75), shirtM, 0,1.05,0);
    const apron = mesh(g, B(.42,.52,.04), o.apron || 0x2a9d8f, 0,1.0,.3); apron.visible = !!o.apron;
    [-.37,.37].forEach(x=>{ const p = new THREE.Group(); p.position.set(x,1.36,0); g.add(p);
      mesh(p, C(.07,.07,.55), shirtM, 0,-.27,0); mesh(p, Sp(.08), skinM, 0,-.57,0); arms.push(p); });
    mesh(g, Sp(.3), skinM, 0,1.72,0);
    mesh(g, new THREE.SphereGeometry(.32,28,18,0,Math.PI*2,0,Math.PI/2.1), hairM, 0,1.76,-.02);
    const tail = mesh(g, Sp(.13), hairM, 0,1.74,-.32); tail.visible = !!o.girl;
    const bow = mesh(g, Sp(.075), 0xff4d8d, 0,1.9,-.28); bow.visible = !!o.girl;
    [-.1,.1].forEach(x=>mesh(g, Sp(.04), 0x222222, x,1.76,.27));
    [-.17,.17].forEach(x=>{ const ch = mesh(g, Sp(.05), 0xff9eb5, x,1.66,.24); ch.scale.z = .4; });
    const mouth = mesh(g, new THREE.TorusGeometry(.07,.017,8,16,Math.PI), 0xc0392b, 0,1.63,.28); mouth.rotation.z = Math.PI;
    const must = mesh(g, B(.24,.05,.05), 0x3b2a1a, 0,1.67,.29); must.visible = !!o.must;
    const hat = mesh(g, C(.22,.26,.28), 0xffffff, 0,2.08,0); hat.visible = !!o.hat;
    g.userData = { legs, arms, shirtM, hairM, skinM, mouth, must, apron, tail, bow, hat };
    return g;
  }

  /* =================== 街道場景 =================== */
  const street = new THREE.Scene();
  street.background = new THREE.Color(0xbfe9ff); street.fog = new THREE.Fog(0xbfe9ff, 35, 80);
  lights(street);
  const grass = mesh(street, new THREE.PlaneGeometry(120,60), 0x9ed89a, 0,0,0); grass.rotation.x = -Math.PI/2;
  const road = mesh(street, new THREE.PlaneGeometry(120,6), 0x5c5f66, 0,.01,4.2); road.rotation.x = -Math.PI/2;
  for(let x=-50;x<50;x+=3){ const d = mesh(street, new THREE.PlaneGeometry(1.4,.18), 0xffffff, x,.02,4.2); d.rotation.x = -Math.PI/2; }

/* 彩虹漸層（紅橘黃綠藍靛紫） */
function rainbow(n){
  const base = ['#ef4444','#f97316','#facc15','#22c55e','#3b82f6','#4f46e5','#a855f7'];
  if(n===7) return base.slice();
  const hx = h => [1,3,5].map(i=>parseInt(h.substr(i,2),16));
  return Array.from({length:n},(_,i)=>{ const t = i*6/(n-1), lo = Math.floor(t), f = t-lo, a = hx(base[lo]), b = hx(base[Math.min(6,lo+1)]);
    return '#'+a.map((v,j)=>Math.round(v+(b[j]-v)*f).toString(16).padStart(2,'0')).join(''); });
}

/* ---------- 引導式步驟引擎（支援回到上一步） ---------- */
function runGuide(phases, onFinish){
  const rid = game.rid;
  let i = Math.min(game.resume || 0, phases.length-1); game.resume = 0;
  for(let k=0;k<i;k++){ const p = phases[k]; p.pre && p.pre();
    if(p.slot){ setDone(p.slot, p.ans); p.after && p.after(); } else p.auto && p.auto(); }
  game.guideIdx = i;
  function start(){
    if(rid!==game.rid) return;
    const p = phases[i], tip = $('#tip');
    p.pre && p.pre();
    if(tip){ tip.innerHTML = p.tip; tip.classList.remove('pop'); void tip.offsetWidth; tip.classList.add('pop'); }
    speak(p.tip);
    if(p.slot){
      unlockSlot(p.slot);
      game.check = () => {
        const v = getSlot(p.slot);
        if(!v) return wrong('先用數字九宮格填入答案喔！');
        if(v===p.ans){ setDone(p.slot, v); sfx('ok'); if(p.ok) praise(p.ok); p.after && p.after(); advance(); }
        else { wrong(p.hint || '再想想看！'); clearSlot(p.slot); }
      };
    } else { game.check = null; p.setup(advance); }
  }
  function advance(){
    if(rid!==game.rid) return;
    i++; game.guideIdx = i; game.check = null;
    if(i<phases.length) setTimeout(start, 650); else setTimeout(()=>{ if(rid===game.rid) onFinish(); }, 650);
  }
  start();
}
const demoP = (tip, act) => ({ tip, auto:act, setup(adv){ const b = $('#demoNext'); show(b); b.onclick = () => { hide(b); sfx('tap'); act(); adv(); }; } });
function undo(){
  if(game.busy || !game.level) return;
  sfx('tap');
  if(game.undo){ game.undo(); return; }
  if(game.guideIdx>0){ game.resume = game.guideIdx-1; renderStep(); toast('↩️','回到上一步','info'); toastTimer = setTimeout(hideToast,900); return; }
  if(game.step>0){ game.step--; renderStep(); toast('↩️','回到上一步','info'); toastTimer = setTimeout(hideToast,900); return; }
  toast('↩️','已經是第一步了！','info'); toastTimer = setTimeout(hideToast,1200);
}

            ${okBtn()}</div>`);
      },
      bind(){
        W.bottleReset();
        const cnt = {T:0,F:0}, N = {T:7,F:8}, rid = game.rid, S = {};
        let counted = false;
        ['T','F'].forEach(k=>S[k] = {tx:0,ty:0,pouring:false,drag:false,auto:false,sx:0,sy:0,lx:0,ly:0});
        const el = k => $('#drag'+k);
        const cellOf = k => $('#row'+k).children[cnt[k]];
        const apply = (k,t) => { const e = el(k); e.style.transition = t || 'none'; e.style.transform = `translate(${S[k].tx}px,${S[k].ty}px)`; };
        const goHome = k => { S[k].tx = 0; S[k].ty = 0; el(k).classList.remove('dragging'); apply(k,'transform .5s cubic-bezier(.3,1.4,.5,1)'); };
        const mouth = k => { const r = $('#bw'+k+' .neck').getBoundingClientRect(); return { x:r.left+6, y:r.top+r.height*.5 }; };
        const markTargets = () => ['T','F'].forEach(k=>{

          show($('#countQ')); $('#countQ').scrollIntoView({behavior:'smooth', block:'center'});

            { slot:'c1', ans:'7', tip:`看杯子下面的數字：${R('高瘦瓶')}倒到第幾杯？一共倒滿幾杯？`, hint:'看高瘦瓶那一排，最後一個有顏色的是第幾杯？' },

          ], ()=>correct(`${R('實證')}完成：${R('高瘦瓶')} 7 杯、${R('矮胖瓶')} 8 杯！`));
        };
        async function doPour(k){
          const s = S[k]; if(s.pouring || cnt[k]>=N[k]) return; s.pouring = true;
          const e = el(k), cell = cellOf(k), cup = cell.querySelector('.sc');

          s.tx += (c.left+c.width/2+30) - (e.getBoundingClientRect().left+e.getBoundingClientRect().width/2);
          s.ty += (c.top-40) - e.getBoundingClientRect().bottom; apply(k,'transform .25s ease-out');
          await wait(260); if(rid!==game.rid) return;
          e.classList.add('pouring'); sfx('tap');
          await wait(330); if(rid!==game.rid) return;
          c = cup.getBoundingClientRect(); let m = mouth(k);
          s.tx += (c.left+c.width/2) - m.x; s.ty += (c.top-60) - m.y; apply(k,'transform .2s ease-out');
          await wait(220); if(rid!==game.rid) return;
          m = mouth(k); c = cup.getBoundingClientRect();
          const layer = $(`#bt${k} .layer:not(.gone)`), color = layer.style.background;
          const st = document.createElement('div'); st.className = 'stream';
          st.style.background = `linear-gradient(90deg, ${color} 0%, rgba(255,255,255,.75) 45%, ${color} 70%)`;
          st.style.left = (c.left+c.width/2-5)+'px'; st.style.top = m.y+'px'; st.style.height = '0px'; document.body.appendChild(st);
          sfx('drip');
          requestAnimationFrame(()=>{ st.style.transition = 'height .28s ease-in'; st.style.height = Math.max(20, c.bottom-6-m.y)+'px'; });
          setTimeout(()=>{ layer.classList.add('gone'); cup.querySelector('.fill').style.background = `linear-gradient(${color}, ${color})`; cup.classList.add('full'); }, 260);
          await wait(820);
          st.style.transition = 'top .25s ease-in, height .25s ease-in'; st.style.top = (c.bottom-8)+'px'; st.style.height = '0px';
          await wait(260); st.remove();
          e.classList.remove('pouring'); s.pouring = false;
          if(rid!==game.rid) return;
          cnt[k]++; W.pour(k); cell.classList.add('got'); sfx('key'); markTargets();
          speak(`第${cnt[k]}杯`, true);
          $('#gt'+k).textContent = cnt[k]>=N[k] ? '✔ 倒完了' : `還有 ${N[k]-cnt[k]} 層`;
          if(cnt[k]>=N[k]){ e.style.opacity = .55; const b = $('#pb'+k); b.disabled = true; b.textContent = '✔ 倒完了'; }
          s.sx = s.lx - s.tx; s.sy = s.ly - s.ty;
          if(!s.drag && !s.auto) goHome(k);
          finishCheck();
        }
        ['T','F'].forEach(k=>{
          const e = el(k), s = S[k];
          $('#pb'+k).onclick = async () => {
            if(s.pouring || s.drag || s.auto || cnt[k]>=N[k] || game.busy) return;
            s.auto = true; e.classList.add('dragging'); sfx('tap');
            const c = cellOf(k).querySelector('.sc').getBoundingClientRect(), b = e.getBoundingClientRect();
            s.tx += (c.left+c.width/2+30) - (b.left+b.width/2); s.ty += (c.top-40) - b.bottom; apply(k,'transform .55s ease-in-out');
            await wait(580); if(rid!==game.rid) return;
            await doPour(k); if(rid!==game.rid) return;
            s.auto = false; goHome(k);
          };
          e.onpointerdown = ev => {
            if(cnt[k]>=N[k] || s.pouring || s.auto || game.busy) return; ev.preventDefault();
            s.drag = true; e.setPointerCapture(ev.pointerId);
            s.sx = ev.clientX - s.tx; s.sy = ev.clientY - s.ty; s.lx = ev.clientX; s.ly = ev.clientY;
            e.classList.add('dragging'); sfx('tap');
          };
          e.onpointermove = ev => {
            if(!s.drag) return; s.lx = ev.clientX; s.ly = ev.clientY;
            if(s.pouring || cnt[k]>=N[k]) return;
            s.tx = ev.clientX - s.sx; s.ty = ev.clientY - s.sy; apply(k);
            const c = cellOf(k).querySelector('.sc').getBoundingClientRect(), b = e.getBoundingClientRect();
            const dx = Math.abs((b.left+b.width/2)-(c.left+c.width/2));
            if(dx<130 && b.bottom<c.top+30 && b.bottom>c.top-260) doPour(k);   // 放寬磁吸範圍
          };
          const end = () => { if(!s.drag) return; s.drag = false; if(!s.pouring) goHome(k); };
          e.onpointerup = end; e.onpointercancel = end;
        });
        game.undo = () => { if(cnt.T+cnt.F>0){ renderStep(); toast('↩️','瓶子重新裝滿，再倒一次！','info'); toastTimer = setTimeout(hideToast,1200); } else { game.step--; renderStep(); } };
        markTargets();
      }
    },
    { part:'Part 3 破除迷思', who:'aunt',
      say:()=>`${R('高瘦瓶')}倒了 7 杯，${R('矮胖瓶')}倒了 8 杯，哪一瓶裝得比較多？`,

      bind(){
        $$('[data-s]').forEach(b=>b.onclick=()=>{

          if(b.dataset.s==='<'){ $('#cmpSlot').textContent = '＜'; hide($('#st1')); praise('7 ＜ 8！', true); show($('#st2'));

const LV = {
  1:{ icon:'💰', title:'收銀台算錢', desc:'第一位客人：價目表缺空・找零驗算・硬幣湊數' },
  2:{ icon:'📏', title:'吸管救援', desc:'第二位客人：直尺測量・吸管拼接・對比牆' },
  3:{ icon:'🌈', title:'彩虹奶昔', desc:'第三位客人：容量預測・拖拽倒水實證' }
};
function renderStep(){
  const L = LEVELS[game.level], st = L[game.step], sp = SPK[st.who];
  game.rid++; game.check = null; game.onPad = null; game.undo = null; game.guideIdx = 0;
  $$('.stream').forEach(s=>s.remove());
  const cust = SPK[{1:'mei',2:'yu',3:'aunt'}[game.level]];
  W.setCustomer(cust);
  if(st.angerStart!==undefined) setAnger(st.angerStart);
  if(st.anger){ show($('#anger'), true); panel.style.top = '8.3rem'; panel.style.maxHeight = 'calc(100vh - 9.1rem)'; }
  else { hide($('#anger')); panel.style.top = ''; panel.style.maxHeight = ''; }
  if(game.level===2 && !st.anger && game.step>0) W.setAnger(game.anger); else if(!st.anger) W.setAnger(0);
  show(panel);
  panel.innerHTML = `
    <div class="flex flex-wrap items-center justify-between gap-2 mb-2"><span class="tag">${LV[game.level].icon} ${R('關卡')}${CN[game.level]}｜${st.part}</span>
      <div class="flex items-center gap-2"><span class="text-amber-700 font-black text-xl">${game.step+1} / ${L.length}</span>
      <button class="undo-btn" onclick="undo()">↩️ 回到上一步</button></div></div>
    <div class="flex items-start gap-3 mb-3"><div class="text-center shrink-0 w-[5.5rem]"><div class="text-5xl md:text-6xl leading-none">${sp.emoji}</div><div class="text-xs font-black mt-1 leading-4">${sp.name}</div></div>
      <div id="sayBox" class="bubble">${st.say()}</div></div>
    <div id="body">${st.body()}</div>`;
  panel.scrollTop = 0;
  speak(st.say(), true);
  st.bind && st.bind();
  game.resume = 0;
}
function next(){
  const L = LEVELS[game.level];
  if(game.step < L.length-1){ game.step++; renderStep(); }
}
function startLevel(n){
  if(n>game.unlocked){ sfx('no'); toast('🔒', `先完成${R('關卡')}${CN[n-1]}才能${R('解鎖')}喔！`, 'no'); toastTimer = setTimeout(hideToast,1800); return; }
  sfx('tap'); hide($('#map')); show($('#mapBtn'));
  game.level = n; game.step = 0; game.d = {}; game.busy = false; game.resume = 0;
  W.setLevel('L'+n); W.setCoins([]); setAnger(0);
  if(n===3) W.bottleReset();
  toast(LV[n].icon, `${R('關卡')}${CN[n]}：${LV[n].title}`, 'info'); toastTimer = setTimeout(hideToast, 1500);
  renderStep();
}
function completeLevel(n){
  game.done[n] = true; game.justUnlocked = n<3 && game.unlocked<n+1 ? n+1 : null; game.unlocked = Math.max(game.unlocked, n+1);
  game.rid++; game.level = 0;
  hide(panel); hide($('#anger')); hide($('#mapBtn'));
  sfx('win'); W.cheer(); W.celebrate(90); confettiDOM(80);
  $('#clearTitle').innerHTML = `${R('關卡')}${CN[n]}${R('完勝')}！`;
  $('#clearText').innerHTML = n<3 ? `🔓 ${R('解鎖')}${R('關卡')}${CN[n+1]}：${LV[n+1].title}！` : `🎊 三個${R('關卡')}全部${R('完勝')}！<br>${R('老闆')}有話要跟你們說…`;
  $('#clearBtn').innerHTML = n<3 ? `🗺️ 回到${R('關卡')}${R('地圖')}` : `🧔 去見${R('老闆')}`;
  $('#clearBtn').onclick = () => { sfx('tap'); hide($('#clear')); n<3 ? showMap() : bossScene(); };
  show($('#clear'), true); speak(plain($('#clearTitle').innerHTML)+'。'+plain($('#clearText').innerHTML), true);
}
function showMap(){
  game.rid++; game.level = 0;
  hide(panel); hide($('#anger')); hide($('#mapBtn'));
  W.setLevel('map'); W.setCustomer(SPK.boss); W.setAnger(0);
  $('#mapTitle').innerHTML = `🗺️ ${R('關卡')}${R('地圖')}`;
  $('#mapSub').innerHTML = `${game.name}，完成一關就能${R('解鎖')}下一關！`;
  $('#mapCards').innerHTML = [1,2,3].map(n=>{
    const lock = n>game.unlocked, done = game.done[n];
    return `${n>1?'<div class="text-5xl font-black text-amber-500 hidden md:block">➜</div>':''}
      <button class="lvcard ${lock?'lock':''} ${done?'done':''} ${game.justUnlocked===n?'newly':''}" data-lv="${n}">
        <div class="text-6xl">${lock?'🔒':LV[n].icon}</div>
        <div class="text-3xl font-black mt-2 leading-[3.2rem]">${R('關卡')}${CN[n]}</div>
        <div class="text-2xl font-black text-amber-700">${LV[n].title}</div>
        <div class="text-base font-bold mt-1">${LV[n].desc}</div>
        <div class="mt-3 inline-block rounded-full px-4 py-1 font-black text-lg ${done?'bg-green-400 text-white':lock?'bg-gray-300':'bg-amber-400 text-white'}">
          ${done?'✅ 已完勝・再玩':lock?'未解鎖':'▶ 開始'}</div>
      </button>`;
  }).join('');
  $$('[data-lv]').forEach(b=>b.onclick=()=>startLevel(+b.dataset.lv));
  if(game.justUnlocked){ sfx('unlock'); speak(`關卡${CN[game.justUnlocked]}解鎖了！`, true); }
  game.justUnlocked = null;
  show($('#map'), true);
}
function showDialog(lines, done){
  let i = 0; const box = $('#dlg');
  const render = () => {
    const l = lines[i], s = SPK[l.who];
    $('#dlgAva').textContent = s.emoji; $('#dlgName').textContent = s.name; $('#dlgText').innerHTML = l.text;
    if(s.shirt!==undefined) W.setCustomer(s);
    W.cheer(); speak(l.text, true);
    $('#dlgNext').innerHTML = i<lines.length-1 ? '繼續 ▶' : (l.btn || '好！▶');
  };
  $('#dlgNext').onclick = () => { sfx('tap'); i++; if(i<lines.length) render(); else { hide(box); done && done(); } };
  show(box); render();
}
ZY['保護'] = 'ㄅㄠˇ ㄏㄨˋ';
function bossScene(){
  W.setLevel('boss'); W.setCustomer(SPK.boss);
  showDialog([
    { who:'boss', text:`太厲害了！謝謝兩位小${R('店員')}，用${R('數學')}解決難題還幫忙減少${R('塑膠')}垃圾！` },
    { who:'boss', text:`${game.name}，最後我們一起許下 SDGs 14 ${R('減塑')}${R('承諾')}，${R('保護')}${R('海洋')}裡的小動物吧！`, btn:'我願意！▶' }
  ], showPromise);
}
function showPromise(){
  $('#promiseTitle').innerHTML = `🐢 ${R('減塑')}${R('承諾')}書`;
  $('#promiseSub').innerHTML = `勾選你願意做到的事（至少一項）`;
  const items = [
    `🥤 買飲料時${R('自備')}${R('環保杯')}`,
    `🥢 ${R('自備')}${R('環保吸管')}，不拿塑膠吸管`,
    `🚫 減少使用${R('一次性')}${R('塑膠')}（塑膠袋、杯蓋）`
  ];
  $('#pList').innerHTML = items.map(t=>`<div class="pcard"><div class="box">✓</div><div>${t}</div></div>`).join('');
  $$('.pcard').forEach(c=>c.onclick=()=>{ c.classList.toggle('on'); sfx('tap'); });
  $('#pBtn').innerHTML = `✍️ 我${R('承諾')}！${R('送出')}`;
  $('#pBtn').onclick = () => {
    const on = $$('.pcard.on');
    if(!on.length){ sfx('no'); toast('🤔','至少勾選一項承諾喔！','no'); speak('至少勾選一項承諾喔！', true); toastTimer = setTimeout(hideToast, 2000); return; }
    game.promises = on.map(c=>c.querySelector('div:last-child').innerHTML);
    sfx('ok'); hide($('#promise'));
    showDialog([{ who:'boss', text:`我宣布：${game.name}，獲得${R('老闆')}親自頒發的「${R('永續')}${R('小')}${R('店長')}${R('大師')}${R('勳章')}」！`, btn:'領取勳章 🏅' }], award);
  };
  show($('#promise'), true); speak('勾選你願意做到的減塑承諾！', true);
}
function award(){
  $('#awardTitle').innerHTML = `${R('恭喜')}${R('完勝')}！`;
  $('#awardName').innerHTML = `🏅 ${R('永續')}${R('小')}${R('店長')}${R('大師')}${R('勳章')}`;
  $('#awardTo').innerHTML = `頒給：${game.name}（大家一起來顧店）`;
  $('#awardStars').textContent = game.stars;
  $('#awardList').innerHTML = game.promises.map(p=>`<li>✅ ${p}</li>`).join('');
  $('#againBtn').innerHTML = `🔁 ${R('再玩一次')}`;
  $('#againBtn').onclick = () => location.reload();
  show($('#award'), true);
  cheerSound(); W.celebrate(320); W.cheer(); confettiDOM(200);
  setTimeout(()=>confettiDOM(160), 1500); setTimeout(()=>{ confettiDOM(160); W.celebrate(200); cheerSound(); }, 3000);
  speak(`恭喜${game.name}！獲得永續小店長大師勳章！`, true);
}

/* =========================================================
   7. 開場：街道 → 進店 → 登入 → 地圖
========================================================= */
function fadeTo(cb){ const f = $('#fade'); f.style.opacity = 1; setTimeout(()=>{ cb(); f.style.opacity = 0; }, 550); }
let entered = false;
function enterShop(){
  if(entered) return; entered = true; sfx('win');
  fadeTo(()=>{ hide($('#streetUI')); W.toShop(); W.setLevel('map'); W.setCustomer(SPK.boss); document.body.style.background = '#ffeedd'; show($('#login'), true); speak('請選擇角色，並輸入你的名字！', true); });
}
function initUI(){
  $('#hudTitle').innerHTML = `🧋 ${R('永續')}${R('飲料店')}`;
  $('#streetTitle').innerHTML = `🧋 永續飲料店<br class="md:hidden"> 數學小店員`;
  $('#walkTip').textContent = '👫 兩位小店員正走去飲料店上班…';
  $('#enterBtn').textContent = '👆 點擊進店';
  $('#loginTitle').textContent = '選擇角色';
  $('#roleName').textContent = '【大家一起來顧店】';
  $('#nameLabel').textContent = '✏️ 輸入你的名字';
  $('#loginBtn').textContent = '確定 ✔';
  $('#angerLabel').innerHTML = `第二位客人的${R('怒氣值')}`;
  const zyLabel = () => $('#zyBtn').innerHTML = `${document.body.classList.contains('no-zy')?'⬜':'🔤'} 注音`;
  zyLabel();
  $('#zyBtn').onclick = () => { document.body.classList.toggle('no-zy'); zyLabel(); sfx('tap'); };
  $('#sndBtn').onclick = () => { soundOn = !soundOn; $('#sndBtn').textContent = soundOn ? '🔊' : '🔈'; sfx('tap'); };
  $('#voiceBtn').onclick = () => { voiceOn = !voiceOn; $('#voiceBtn').textContent = voiceOn ? '🗣️ 語音' : '🤐 靜音'; if(!voiceOn && 'speechSynthesis' in window) speechSynthesis.cancel(); sfx('tap'); };
  $('#mapBtn').onclick = () => { sfx('tap'); game.busy = false; showMap(); };

  W.startWalk(()=>{
    hide($('#skipBtn')); show($('#enterBtn'));
    $('#walkTip').textContent = '🎉 到了！點擊飲料店或按鈕進店';
    sfx('unlock');
  });
  W.onShop(enterShop);
  $('#skipBtn').onclick = () => { sfx('tap'); W.skipWalk(); };
  $('#enterBtn').onclick = enterShop;

  let roleSel = false;
  $('#roleCard').onclick = () => { roleSel = !roleSel; $('#roleCard').classList.toggle('sel', roleSel); sfx('tap'); if(roleSel) speak('大家一起來顧店！', true); };
  $('#loginBtn').onclick = () => {
    const nm = $('#nameIn').value.trim();
    if(!roleSel){ sfx('no'); $('#roleCard').classList.add('shake'); setTimeout(()=>$('#roleCard').classList.remove('shake'),400); speak('請先點選角色！', true); return; }
    if(!nm){ sfx('no'); $('#nameIn').focus(); $('#nameIn').classList.add('shake'); setTimeout(()=>$('#nameIn').classList.remove('shake'),400); speak('請輸入你的名字！', true); return; }
    game.name = nm.replace(/[<>&"]/g,''); SPK.me.name = game.name; sfx('ok');
    hide($('#login')); show($('#hud'), true);
    $('#hudName').textContent = `👦👧 ${game.name}`; show($('#hudName'));
    showDialog([
      { who:'boss', text:`歡迎光臨${R('永續')}${R('飲料店')}！${game.name}，今天你們兩位就是本店的小${R('店員')}！` },
      { who:'boss', text:`今天會有三位客人上門，他們會遇到各種${R('數學')}難題，要靠你們幫忙解決。我們店還有一個目標：一起減少${R('塑膠')}垃圾！` },
      { who:'boss', text:`先從${R('關卡')}一開始吧！完勝一關，就能${R('解鎖')}下一關，加油！`, btn:`打開${R('關卡')}${R('地圖')} 🗺️` }
    ], showMap);
  };
  $('#nameIn').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#loginBtn').click(); });

  panel.addEventListener('click', e=>{
    const s = e.target.closest('.sl'); if(s) activate(s);
    const k = e.target.closest('[data-k]'); if(k) padPress(k.dataset.k);
  });
  document.addEventListener('keydown', e=>{
    if(e.target.tagName==='INPUT') return;
    if(!$('#dlg').classList.contains('hidden') && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); $('#dlgNext').click(); return; }
    if(panel.classList.contains('hidden')) return;
    if(/^[0-9]$/.test(e.key)) padPress(e.key);
    else if(e.key==='Backspace'){ e.preventDefault(); padPress('del'); }
    else if(e.key==='Enter'){ e.preventDefault(); submit(); }
  });
}
initUI();
</script>
